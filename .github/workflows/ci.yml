name: CI

on:
  push:
    branches:
      - feature/request-validation-standardized-errors
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Jest + Supertest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log commit SHA
        run: |
          echo "Event:        ${{ github.event_name }}"
          echo "Ref:          ${{ github.ref }}"
          echo "Commit SHA:   ${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Workflow SHA: ${{ github.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      # The database layer is mocked in the tests; no PostgreSQL is required.
      - name: Run backend tests
        working-directory: server
        run: npm test -- --ci --verbose --json --outputFile=jest-results.json

      - name: Write test evidence
        if: always()
        working-directory: server
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e '
            const r=require("./jest-results.json"),e=process.env;
            const ev={commit_sha:e.COMMIT_SHA,run_url:e.RUN_URL,suites_total:r.numTotalTestSuites,suites_passed:r.numPassedTestSuites,tests_total:r.numTotalTests,tests_passed:r.numPassedTests,tests_failed:r.numFailedTests,success:r.success};
            require("fs").writeFileSync("test-evidence.json",JSON.stringify(ev,null,2));
            console.log("### Backend tests @ "+ev.commit_sha);
            console.log(ev.tests_passed+"/"+ev.tests_total+" passed, "+ev.suites_passed+"/"+ev.suites_total+" suites");
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            server/jest-results.json
            server/test-evidence.json

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log commit SHA
        run: |
          echo "Event:        ${{ github.event_name }}"
          echo "Ref:          ${{ github.ref }}"
          echo "Commit SHA:   ${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Workflow SHA: ${{ github.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build
